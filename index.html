<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wedding Expense Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap');

  :root{
    --maroon:#6B1E3C;
    --maroon-dark:#4A1329;
    --gold:#C9932E;
    --gold-light:#F3DFB0;
    --ivory:#FBF7F0;
    --card:#FFFFFF;
    --green:#3D5C3A;
    --green-light:#DCE8D8;
    --text:#2B2320;
    --text-soft:#7A6E63;
    --border:#E7DECF;
    --red:#A33A3A;
    --red-light:#F5DEDE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Work Sans',sans-serif; background:var(--ivory); color:var(--text);
    padding:24px 16px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  h1{
    font-family:'Fraunces',serif; font-weight:600; font-size:28px; text-align:center;
    color:var(--maroon); margin:0 0 4px;
  }
  .sub{text-align:center;color:var(--text-soft);font-size:14px;margin-bottom:24px;}
  .balance-card{
    background:var(--maroon); border-radius:16px; padding:22px 20px; color:#fff; text-align:center;
    margin-bottom:20px; position:relative; overflow:hidden;
  }
  .balance-card::before{
    content:"";position:absolute;top:-40%;left:50%;transform:translateX(-50%);
    width:220px;height:220px;background:var(--gold);opacity:0.15;border-radius:50%;
  }
  .balance-label{font-size:12px;letter-spacing:0.08em;text-transform:uppercase;opacity:0.75;position:relative;}
  .balance-amount{font-family:'Fraunces',serif;font-size:34px;font-weight:600;margin:6px 0;position:relative;}
  .balance-side{font-size:14px;opacity:0.9;position:relative;}
  .scale{
    display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;position:relative;
  }
  .scale-side{
    flex:1;max-width:150px;background:rgba(255,255,255,0.12);border-radius:10px;padding:10px;
  }
  .scale-side .amt{font-family:'Fraunces',serif;font-size:18px;font-weight:600;}
  .scale-side .lbl{font-size:11px;opacity:0.8;text-transform:uppercase;letter-spacing:0.05em;}

  .summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px;}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
  .stat .lbl{font-size:12px;color:var(--text-soft);margin-bottom:4px;}
  .stat .val{font-family:'Fraunces',serif;font-size:19px;font-weight:600;color:var(--maroon-dark);}

  .section-title{
    font-family:'Fraunces',serif;font-size:18px;font-weight:600;color:var(--maroon-dark);
    margin:28px 0 12px;display:flex;align-items:center;justify-content:space-between;
  }
  button{
    font-family:'Work Sans',sans-serif;cursor:pointer;border:none;border-radius:8px;
    font-size:13px;font-weight:500;
  }
  .btn-primary{background:var(--maroon);color:#fff;padding:9px 16px;}
  .btn-primary:hover{background:var(--maroon-dark);}
  .btn-ghost{background:transparent;color:var(--maroon);border:1px solid var(--border);padding:8px 14px;}
  .btn-ghost:hover{background:var(--gold-light);}
  .btn-danger{background:transparent;color:var(--red);border:1px solid var(--red-light);padding:6px 10px;font-size:12px;}
  .btn-danger:hover{background:var(--red-light);}

  form.expense-form{
    background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:20px;
    display:none;
  }
  form.expense-form.open{display:block;}
  .form-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .form-row > div{flex:1;min-width:140px;}
  label{font-size:12px;color:var(--text-soft);display:block;margin-bottom:4px;}
  input,select{
    width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;
    font-family:'Work Sans',sans-serif;background:#fff;color:var(--text);
  }
  input:focus,select:focus{outline:none;border-color:var(--gold);}
  .form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px;}

  .expense-card{
    background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;
  }
  .expense-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:8px;}
  .expense-title{font-weight:600;font-size:15px;}
  .expense-cat{font-size:12px;color:var(--text-soft);}
  .expense-total{font-family:'Fraunces',serif;font-weight:600;font-size:17px;color:var(--maroon-dark);white-space:nowrap;}
  .badge{
    display:inline-block;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500;margin-top:4px;
  }
  .badge.paid{background:var(--green-light);color:var(--green);}
  .badge.partial{background:var(--gold-light);color:#8A6212;}
  .badge.pending{background:var(--red-light);color:var(--red);}

  .split-bar{
    display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--border);margin:10px 0 8px;
  }
  .split-bar .boy{background:#7A9FD9;}
  .split-bar .girl{background:#D97CA8;}

  .split-detail{display:flex;justify-content:space-between;font-size:12px;color:var(--text-soft);}
  .split-detail span b{color:var(--text);}

  .expense-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;}

  .empty{text-align:center;color:var(--text-soft);font-size:14px;padding:40px 20px;}
  .filters{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;}
  .filter-chip{
    padding:6px 12px;border-radius:20px;border:1px solid var(--border);font-size:12px;white-space:nowrap;
    background:#fff;color:var(--text-soft);cursor:pointer;
  }
  .filter-chip.active{background:var(--maroon);color:#fff;border-color:var(--maroon);}
  .note{font-size:12px;color:var(--text-soft);text-align:center;margin-top:28px;}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div class="wrap">
  <h1>Wedding expense ledger</h1>
  <div class="sub">Track spending across boy's side and girl's side, in one shared place</div>

  <div class="balance-card">
    <div class="balance-label">Net balance</div>
    <div class="balance-amount" id="netBalanceText">Loading…</div>
    <div class="balance-side" id="netBalanceSide"></div>
    <div class="scale">
      <div class="scale-side">
          <div class="lbl">Bhavin (groom) paid</div>
        <div class="amt" id="boyPaidTotal">₹0</div>
      </div>
      <div class="scale-side">
          <div class="lbl">Shweta (bride) paid</div>
        <div class="amt" id="girlPaidTotal">₹0</div>
      </div>
    </div>
  </div>

  <div class="summary-grid">
    <div class="stat"><div class="lbl">Total cost</div><div class="val" id="statTotal">₹0</div></div>
    <div class="stat"><div class="lbl">Total paid</div><div class="val" id="statPaid">₹0</div></div>
    <div class="stat"><div class="lbl">Pending</div><div class="val" id="statPending">₹0</div></div>
  </div>

  <div class="section-title">
    Expenses
    <button class="btn-primary" id="toggleForm">+ Add expense</button>
  </div>

  <div class="expense-form" id="expenseForm">
    <div class="form-row">
      <div>
        <label>Category</label>
        <select id="f-category">
          <option>Venue</option>
          <option>Photographer</option>
          <option>Caterer</option>
          <option>Decor</option>
          <option>Mehendi/Sangeet</option>
          <option>DJ/Music</option>
          <option>Outfits</option>
          <option>Jewelry</option>
          <option>Invitations</option>
          <option>Priest/Rituals</option>
          <option>Other</option>
        </select>
      </div>
      <div>
        <label>Vendor / description</label>
        <input type="text" id="f-vendor" placeholder="e.g. Sharma Caterers">
      </div>
    </div>
    <div class="form-row">
      <div>
        <label>Total bill amount (₹)</label>
        <input type="number" id="f-total" placeholder="0" min="0">
      </div>
      <div>
        <label>Split — boy's side share (%)</label>
        <input type="number" id="f-splitBoy" placeholder="50" min="0" max="100" value="50">
      </div>
    </div>
    <div class="form-row">
      <div>
        <label>Amount already paid by boy's side (₹)</label>
        <input type="number" id="f-boyPaid" placeholder="0" min="0">
      </div>
      <div>
        <label>Amount already paid by girl's side (₹)</label>
        <input type="number" id="f-girlPaid" placeholder="0" min="0">
      </div>
    </div>
    <div class="form-row">
      <div>
        <label>Notes (optional)</label>
        <input type="text" id="f-notes" placeholder="e.g. advance paid, balance due Jan 15">
      </div>
    </div>
    <div class="form-actions">
      <button type="button" class="btn-ghost" id="cancelForm">Cancel</button>
      <button type="button" class="btn-primary" id="saveBtn">Save expense</button>
    </div>
  </div>

  <div class="filters" id="filters"></div>

  <div id="expenseList"></div>

  <div class="note">Data is shared — visible to anyone who opens this tracker.</div>
</div>

<script>
const CATEGORIES = ["All","Venue","Photographer","Caterer","Decor","Mehendi/Sangeet","DJ/Music","Outfits","Jewelry","Invitations","Priest/Rituals","Other"];
let expenses = [];
let editingId = null;
let activeFilter = "All";

// ===== FIREBASE CONFIG =====
// 1. Go to https://console.firebase.google.com -> Create project (free)
// 2. Inside the project: Build -> Firestore Database -> Create database -> Start in test mode
// 3. Project settings (gear icon) -> Your apps -> Web app (</>) -> register app
// 4. Copy the firebaseConfig object it gives you and paste it below, replacing this one.
const firebaseConfig = {
  apiKey: "AIzaSyCzAmkj-vk1Wdo8YGNwRfVxzwrBrgfdW8E",
  authDomain: "wedding-tracker-d2aab-dcac1.firebaseapp.com",
  projectId: "wedding-tracker-d2aab-dcac1",
  storageBucket: "wedding-tracker-d2aab-dcac1.firebasestorage.app",
  messagingSenderId: "29733100407",
  appId: "1:29733100407:web:644ceafd7f346f408ddf72"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const expensesRef = db.collection('expenses');

function fmt(n){
  n = Math.round(n||0);
  return "₹" + n.toLocaleString('en-IN');
}

function listenToExpenses(){
  expensesRef.orderBy('createdAt', 'desc').onSnapshot(snapshot=>{
    expenses = snapshot.docs.map(doc=> ({ id: doc.id, ...doc.data() }));
    render();
  }, err=>{
    console.error('Firestore error', err);
    document.getElementById('expenseList').innerHTML =
      '<div class="empty">Could not connect. Check your Firebase config and Firestore rules.</div>';
  });
}

async function upsertExpense(id, data){
  try{
    if(id){
      await expensesRef.doc(id).set(data, { merge: true });
    } else {
      await expensesRef.add(data);
    }
  }catch(e){
    console.error('Save error', e);
    alert('Could not save. Check your Firebase config and Firestore rules.');
  }
}

function computeExpense(e){
  const total = e.total;
  const boyShare = total * (e.splitBoy/100);
  const girlShare = total * (1 - e.splitBoy/100);
  const boyOwed = Math.max(0, boyShare - e.boyPaid);
  const girlOwed = Math.max(0, girlShare - e.girlPaid);
  const totalPaid = e.boyPaid + e.girlPaid;
  const pending = Math.max(0, total - totalPaid);
  let status = 'pending';
  if(pending <= 0.5) status = 'paid';
  else if(totalPaid > 0) status = 'partial';
  return {boyShare, girlShare, boyOwed, girlOwed, totalPaid, pending, status};
}

function renderFilters(){
  const el = document.getElementById('filters');
  el.innerHTML = '';
  CATEGORIES.forEach(cat=>{
    const chip = document.createElement('div');
    chip.className = 'filter-chip' + (cat===activeFilter ? ' active':'');
    chip.textContent = cat;
    chip.onclick = ()=>{ activeFilter = cat; render(); };
    el.appendChild(chip);
  });
}

function render(){
  renderFilters();

  let totalCost=0, totalPaid=0, boyPaidSum=0, girlPaidSum=0, boyShareSum=0, girlShareSum=0;
  expenses.forEach(e=>{
    const c = computeExpense(e);
    totalCost += e.total;
    totalPaid += c.totalPaid;
    boyPaidSum += e.boyPaid;
    girlPaidSum += e.girlPaid;
    boyShareSum += c.boyShare;
    girlShareSum += c.girlShare;
  });
  const totalPending = totalCost - totalPaid;

  document.getElementById('statTotal').textContent = fmt(totalCost);
  document.getElementById('statPaid').textContent = fmt(totalPaid);
  document.getElementById('statPending').textContent = fmt(totalPending);
  document.getElementById('boyPaidTotal').textContent = fmt(boyPaidSum);
  document.getElementById('girlPaidTotal').textContent = fmt(girlPaidSum);

  const net = (boyPaidSum - boyShareSum);
  const netText = document.getElementById('netBalanceText');
  const netSide = document.getElementById('netBalanceSide');
  if(Math.abs(net) < 1){
    netText.textContent = fmt(0);
    netSide.textContent = "Both sides are even";
  } else if(net > 0){
    netText.textContent = fmt(Math.abs(net));
    netSide.textContent = "Girl's side owes boy's side this much";
  } else {
    netText.textContent = fmt(Math.abs(net));
    netSide.textContent = "Boy's side owes girl's side this much";
  }

  const list = document.getElementById('expenseList');
  list.innerHTML = '';
  const filtered = expenses.filter(e => activeFilter==='All' || e.category===activeFilter)
                            .sort((a,b)=> (b.createdAt||0)-(a.createdAt||0));

  if(filtered.length===0){
    list.innerHTML = '<div class="empty">No expenses yet. Add your first one above.</div>';
    return;
  }

  filtered.forEach(e=>{
    const c = computeExpense(e);
    const boyPct = e.total>0 ? (e.boyPaid/e.total*100) : 0;
    const girlPct = e.total>0 ? (e.girlPaid/e.total*100) : 0;
    const card = document.createElement('div');
    card.className = 'expense-card';
    card.innerHTML = `
      <div class="expense-top">
        <div>
          <div class="expense-title">${escapeHtml(e.vendor || e.category)}</div>
          <div class="expense-cat">${e.category}</div>
          <span class="badge ${c.status}">${c.status === 'paid' ? 'Fully paid' : c.status === 'partial' ? 'Partially paid' : 'Pending'}</span>
        </div>
        <div class="expense-total">${fmt(e.total)}</div>
      </div>
      <div class="split-bar">
        <div class="boy" style="width:${boyPct}%"></div>
        <div class="girl" style="width:${girlPct}%"></div>
      </div>
      <div class="split-detail">
        <span>Boy's side: <b>${fmt(e.boyPaid)}</b> paid${c.boyOwed>0.5 ? ` · <b>${fmt(c.boyOwed)}</b> due` : ''}</span>
        <span>Girl's side: <b>${fmt(e.girlPaid)}</b> paid${c.girlOwed>0.5 ? ` · <b>${fmt(c.girlOwed)}</b> due` : ''}</span>
      </div>
      ${e.notes ? `<div style="font-size:12px;color:var(--text-soft);margin-top:8px;">${escapeHtml(e.notes)}</div>` : ''}
      <div class="expense-footer">
        <button class="btn-ghost" data-edit="${e.id}">Edit</button>
        <button class="btn-danger" data-del="${e.id}">Delete</button>
      </div>
    `;
    list.appendChild(card);
  });

  list.querySelectorAll('[data-edit]').forEach(btn=>{
    btn.onclick = ()=> openEdit(btn.getAttribute('data-edit'));
  });
  list.querySelectorAll('[data-del]').forEach(btn=>{
    btn.onclick = ()=> deleteExpense(btn.getAttribute('data-del'));
  });
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function openEdit(id){
  const e = expenses.find(x=>x.id===id);
  if(!e) return;
  editingId = id;
  document.getElementById('f-category').value = e.category;
  document.getElementById('f-vendor').value = e.vendor;
  document.getElementById('f-total').value = e.total;
  document.getElementById('f-splitBoy').value = e.splitBoy;
  document.getElementById('f-boyPaid').value = e.boyPaid;
  document.getElementById('f-girlPaid').value = e.girlPaid;
  document.getElementById('f-notes').value = e.notes || '';
  document.getElementById('saveBtn').textContent = 'Update expense';
  document.getElementById('expenseForm').classList.add('open');
  window.scrollTo({top:0, behavior:'smooth'});
}

async function deleteExpense(id){
  try{
    await expensesRef.doc(id).delete();
  }catch(e){
    console.error('Delete error', e);
    alert('Could not delete. Check your Firebase config and Firestore rules.');
  }
}

function resetForm(){
  editingId = null;
  document.getElementById('f-category').selectedIndex = 0;
  document.getElementById('f-vendor').value = '';
  document.getElementById('f-total').value = '';
  document.getElementById('f-splitBoy').value = 50;
  document.getElementById('f-boyPaid').value = '';
  document.getElementById('f-girlPaid').value = '';
  document.getElementById('f-notes').value = '';
  document.getElementById('saveBtn').textContent = 'Save expense';
}

document.getElementById('toggleForm').onclick = ()=>{
  const form = document.getElementById('expenseForm');
  const opening = !form.classList.contains('open');
  if(opening) resetForm();
  form.classList.toggle('open');
};
document.getElementById('cancelForm').onclick = ()=>{
  document.getElementById('expenseForm').classList.remove('open');
  resetForm();
};

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  const total = parseFloat(document.getElementById('f-total').value) || 0;
  const splitBoy = Math.min(100, Math.max(0, parseFloat(document.getElementById('f-splitBoy').value) || 0));
  const boyPaid = parseFloat(document.getElementById('f-boyPaid').value) || 0;
  const girlPaid = parseFloat(document.getElementById('f-girlPaid').value) || 0;
  const category = document.getElementById('f-category').value;
  const vendor = document.getElementById('f-vendor').value.trim();
  const notes = document.getElementById('f-notes').value.trim();

  if(editingId){
    await upsertExpense(editingId, { category, vendor, total, splitBoy, boyPaid, girlPaid, notes });
  } else {
    await upsertExpense(null, {
      category, vendor, total, splitBoy, boyPaid, girlPaid, notes,
      createdAt: Date.now()
    });
  }

  document.getElementById('expenseForm').classList.remove('open');
  resetForm();
});

listenToExpenses();
</script>
</body>
</html>
