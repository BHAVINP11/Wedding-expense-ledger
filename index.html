<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Expense Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap');

  :root{
    --maroon:#6B1E3C;
    --maroon-dark:#4A1329;
    --gold:#C9932E;
    --gold-light:#F3DFB0;
    --ivory:#FBF7F0;
    --card:#FFFFFF;
    --green:#3D5C3A;
    --green-light:#DCE8D8;
    --text:#2B2320;
    --text-soft:#7A6E63;
    --border:#E7DECF;
    --red:#A33A3A;
    --red-light:#F5DEDE;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Work Sans',sans-serif; background:var(--ivory); color:var(--text);
    padding:24px 16px 60px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  h1{
    font-family:'Fraunces',serif; font-weight:600; font-size:28px; text-align:center;
    color:var(--maroon); margin:0 0 4px;
  }
  .sub{text-align:center;color:var(--text-soft);font-size:14px;margin-bottom:24px;}

  /* Countdown */
  .countdown-card{
    background:linear-gradient(135deg, var(--maroon) 0%, var(--maroon-dark) 100%);
    border-radius:20px; padding:26px 20px 22px; margin-bottom:20px; text-align:center; position:relative; overflow:hidden;
  }
  .countdown-card::before{
    content:"";position:absolute;top:-60%;left:50%;transform:translateX(-50%);
    width:300px;height:300px;background:var(--gold);opacity:0.13;border-radius:50%;
  }
  .countdown-date{color:var(--gold-light);font-size:12px;letter-spacing:0.1em;text-transform:uppercase;position:relative;margin-bottom:12px;}
  .countdown-grid{display:flex;justify-content:center;gap:10px;position:relative;flex-wrap:wrap;}
  .countdown-unit{
    background:rgba(255,255,255,0.1);border-radius:12px;padding:10px 6px;min-width:64px;flex:1;max-width:78px;
  }
  .countdown-num{font-family:'Fraunces',serif;font-size:28px;font-weight:600;color:#fff;line-height:1;}
  .countdown-lbl{font-size:10px;color:var(--gold-light);text-transform:uppercase;letter-spacing:0.06em;margin-top:4px;}

  <!doctype html>
  <html lang="en">
    <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Wedding Expense Tracker</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    </head>
    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.jsx"></script>
    </body>
    </html>
</script>
</body>
</html>
